name: Update formula

# Checks npm once a day and moves the formula to the newest ai-wrapped-year release.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Point the formula at the newest release
        id: bump
        run: |
          latest=$(curl -fsSL https://registry.npmjs.org/ai-wrapped-year/latest | jq -r .version)
          current=$(sed -nE 's|.*ai-wrapped-year-([0-9.]+)\.tgz".*|\1|p' Formula/ai-wrapped-year.rb)
          if [ "$latest" = "$current" ]; then echo "Already on $current"; exit 0; fi
          url="https://registry.npmjs.org/ai-wrapped-year/-/ai-wrapped-year-$latest.tgz"
          sha=$(curl -fsSL "$url" | shasum -a 256 | cut -d' ' -f1)
          sed -i '' -E "s|^  url \".*\"|  url \"$url\"|; s|^  sha256 \".*\"|  sha256 \"$sha\"|" Formula/ai-wrapped-year.rb
          echo "version=$latest" >> "$GITHUB_OUTPUT"

      - name: Install and test before publishing
        if: steps.bump.outputs.version
        run: |
          brew tap-new --no-git local/test
          cp Formula/ai-wrapped-year.rb "$(brew --repository local/test)/Formula/"
          brew install --formula local/test/ai-wrapped-year
          brew test local/test/ai-wrapped-year

      - name: Commit
        if: steps.bump.outputs.version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/ai-wrapped-year.rb
          git commit -m "ai-wrapped-year ${{ steps.bump.outputs.version }}"
          git push
